name: CI

on:
  push:
    branches: [main]
  pull_request:

# lex-schema is the foundational validation package — no path-
# resolved siblings to check out, just the lex toolchain itself.

env:
  LEX_VERSION: v0.9.1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install lex from release
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.lex-bin"
          url="https://github.com/alpibrusl/lex-lang/releases/download/${LEX_VERSION}/lex-${LEX_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSL "$url" | tar -xz -C "$HOME/.lex-bin" --strip-components=1
          chmod +x "$HOME/.lex-bin/lex"
          echo "$HOME/.lex-bin" >> "$GITHUB_PATH"

      - name: Show lex version
        run: lex --version

      # lex ci runs: pkg install → check --strict src/ → fmt --check → test
      - name: Lex CI pipeline
        run: lex ci
