name: publish

# Publishes lex-schema to lexhub.alpibru.com whenever a `v*` tag is pushed.
#
# Prerequisites (one-time setup):
#   1. Go to https://lexhub.alpibru.com and generate an API token for your
#      tenant (the JWT `sub` claim becomes your namespace).
#   2. Add it as a repository secret named `LEX_PUBLISH_TOKEN`:
#      Settings → Secrets and variables → Actions → New repository secret
#
# To ship a new version:
#   1. Bump `version` in lex.toml (e.g. 0.9.2 → 0.9.3).
#   2. Commit and push to main.
#   3. git tag v0.9.3 && git push origin v0.9.3
#   The workflow picks up the tag, type-checks the package, and publishes.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "lex-lang release tag to install (e.g. v0.9.7)"
        required: false
        default: "v0.9.7"

env:
  # Pinned lex toolchain version. Update here when lex-lang ships a new
  # release that lex-schema depends on.
  LEX_VERSION: "v0.9.8"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install lex toolchain
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || env.LEX_VERSION }}"
          URL="https://github.com/alpibrusl/lex-lang/releases/download/${TAG}/lex-${TAG}-x86_64-unknown-linux-gnu.tar.gz"
          echo "Downloading lex ${TAG} from ${URL}"
          curl -fsSL "${URL}" -o /tmp/lex.tar.gz
          tar -xzf /tmp/lex.tar.gz -C /tmp
          # The archive unpacks to lex-{tag}-{target}/lex
          sudo mv "/tmp/lex-${TAG}-x86_64-unknown-linux-gnu/lex" /usr/local/bin/lex
          sudo chmod +x /usr/local/bin/lex
          lex --version

      - name: Type-check package
        run: lex check --strict src/

      - name: Publish to LexHub
        env:
          LEX_PUBLISH_TOKEN: ${{ secrets.LEX_PUBLISH_TOKEN }}
        run: lex pkg publish
