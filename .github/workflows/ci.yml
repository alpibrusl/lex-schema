name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: lex check + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download lex v0.9.1
        run: |
          VERSION=0.9.1
          NAME="lex-v${VERSION}-x86_64-unknown-linux-gnu"
          curl -sSLO --retry 3 \
            "https://github.com/alpibrusl/lex-lang/releases/download/v${VERSION}/${NAME}.tar.gz"
          tar -xzf "${NAME}.tar.gz"
          echo "$PWD/${NAME}" >> "$GITHUB_PATH"

      - name: Type-check sources
        run: |
          failed=0
          for f in src/*.lex; do
            if ! lex check "$f" 2>&1; then
              echo "FAIL: $f"
              failed=$((failed + 1))
            fi
          done
          exit $failed

      - name: Type-check tests
        run: |
          failed=0
          for f in tests/*.lex; do
            if ! lex check "$f" 2>&1; then
              echo "FAIL: $f"
              failed=$((failed + 1))
            fi
          done
          exit $failed

      - name: Run test suites
        run: |
          failed=0
          for f in tests/test_*.lex; do
            result=$(lex run "$f" run_all)
            if [ "$result" != "0" ]; then
              echo "FAIL ($result failures): $f"
              failed=$((failed + 1))
            fi
          done
          exit $failed
