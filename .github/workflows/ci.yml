name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  LEX_VERSION: v0.9.2

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install lex ${{ env.LEX_VERSION }}
        run: |
          set -euo pipefail
          NAME="lex-${LEX_VERSION}-x86_64-unknown-linux-gnu"
          curl -sSL --retry 3 \
            "https://github.com/alpibrusl/lex-lang/releases/download/${LEX_VERSION}/${NAME}.tar.gz" \
            | tar -xz
          sudo mv "${NAME}/lex" /usr/local/bin/lex
          lex --version

      - name: Type-check sources
        run: |
          for f in src/*.lex; do lex check "$f"; done

      - name: Type-check examples
        run: |
          for f in examples/*.lex; do lex check "$f"; done

      - name: Run test suites
        run: |
          set -euo pipefail
          fail=0
          for f in tests/test_*.lex; do
            result=$(lex run "$f" run_all)
            if [ "$result" != "0" ]; then
              echo "FAIL: $f reported $result failure(s)"
              fail=1
            fi
          done
          exit $fail
